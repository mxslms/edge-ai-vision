# Stability parameters for the out-of-tree Realtek rtl8822ce driver.
# Installed to /etc/modprobe.d/rtl8822ce-stability.conf
#
# These are LOAD-TIME parameters. Writing the matching files under
# /sys/module/rtl8822ce/parameters/ changes the live values but the driver
# has already captured them at init, so a reboot is required for a change
# here to actually take effect -- and a reboot is the only way to TEST one.
#
#   rtw_power_mgnt 0 = LPS (Leisure Power Save) off
#   rtw_ips_mode   0 = IPS off; 1 powers the RF down entirely when idle
#
# Why this file exists at all: NetworkManager's wifi.powersave=2 and
# `iw dev <if> set power_save off` only configure the nl80211/mac80211
# layer. This driver runs its own independent LPS/IPS state machines that
# nl80211 does not touch, so `iw ... get power_save` can report "off" while
# the radio is still aggressively power-saving. Check the sysfs values, not iw.
#
# Do NOT add rtw_max_roaming_times here. Setting it to 0 looks like a way to
# suppress the driver's buggy roam path, but it also seeds the join-RETRY
# counter -- at 0 the driver gets one association attempt at boot and never
# retries, which bricked this device across repeated power cycles on
# 2026-08-14. It also does not stop roaming: wpa_supplicant roams via full
# disconnect/connect cycles and ignores this parameter entirely. Use a BSSID
# pin (wifi-relock.sh) instead. See RUNBOOK.md.
options rtl8822ce rtw_power_mgnt=0 rtw_ips_mode=0
