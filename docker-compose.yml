version: '3.8'

services:
  fish-detection-app:
    build: .
    container_name: fish-detection-app
    restart: unless-stopped
    # Maps the physical USB webcam into the container
    devices:
     - /dev/video0:/dev/video0
    # Mounts the current folder so logs or outputs save directly to your host
    volumes:
      - .:/usr/src/app
    # Allocates the NVIDIA GPU to the container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]