version: '3.8'

services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:                     # <--- ADDED
      - monitoring-net            # <--- ADDED
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  fish-detection-app:
    image: ultralytics/ultralytics:latest
    container_name: fish-detection-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - .:/usr/src/app
    # Change this line to use the full path to your app.py
    command: /bin/bash -c "pip install flask && python /usr/src/app/app.py"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
networks:                         # <--- ADDED
  monitoring-net:                 # <--- ADDED
    external: true                # <--- ADDED