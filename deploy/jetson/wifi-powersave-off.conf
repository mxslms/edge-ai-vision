# Installed to /etc/NetworkManager/conf.d/wifi-powersave-off.conf
#
# Disables WiFi power-save at the NetworkManager/nl80211 layer (2 = disable).
# Necessary but NOT sufficient on this hardware -- the out-of-tree rtl8822ce
# driver runs its own LPS/IPS state machines that nl80211 does not control.
# See rtl8822ce-stability.conf, which covers the driver side.
[connection]
wifi.powersave = 2
