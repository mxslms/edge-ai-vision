# Jetson Orin Nano (JetPack 6.x) production compose.
#
# Differences from docker-compose.yml (x86 RTX host):
#   - Image tag :jetson built from Dockerfile.jetson (L4T / JetPack base)
#   - runtime: nvidia (Jetson container runtime) instead of deploy.devices
#   - No DCGM exporter (DCGM targets discrete GPUs; use jtop/tegrastats on Jetson)
#   - Mounts /tmp/argus_socket for optional CSI (nvargus) cameras later
#
# Recommended install (one-shot on the Orin):
#   ./scripts/install-jetson.sh
#
# Manual:
#   docker pull ghcr.io/mxslms/edge-ai-vision:jetson
#   docker compose -f docker-compose.jetson.yml up -d
#
# No `build:` here on purpose — GHCR is the only image source for this file.
# With both `build:` and `image:` present, `docker compose up` builds locally
# instead of pulling whenever the image isn't already cached (e.g. a fresh
# Portainer stack deploy), which needs BuildKit the Jetson agent can't reach.
# For a local/manual build: docker build -f Dockerfile.jetson -t <tag> .
#
# Monitoring (node-exporter, cAdvisor, Promtail, GPU exporter) lives in
# homelab-infrastructure/jetson-monitoring — not in this repo.
#
services:
  fish-detection-app:
    image: ${IMAGE:-ghcr.io/mxslms/edge-ai-vision:jetson}
    pull_policy: always
    container_name: fish-detection-app
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    env_file:
      - path: .env
        required: false
    ports:
      - "100.90.234.112:${HOST_PORT:-5000}:5000"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      # Bind mount, not a named volume -- this is training data meant to be
      # browsed/rsync'd/labeled from the host, not opaque Docker storage.
      - ${CAPTURE_DIR_HOST:-/var/lib/edge-ai-vision/captures}:/data/captures
    environment:
      MODEL_PATH: ${MODEL_PATH:-yolov8n.pt}
      IMG_SIZE: ${IMG_SIZE:-640}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-0}
      FRAME_SLEEP: ${FRAME_SLEEP:-0.06}
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
      MOTION_ENABLED: ${MOTION_ENABLED:-true}
      MOTION_THRESHOLD: ${MOTION_THRESHOLD:-0.005}
      MOTION_TRAILING_SECONDS: ${MOTION_TRAILING_SECONDS:-4.0}
      SHOW_MOTION_OVERLAY: ${SHOW_MOTION_OVERLAY:-true}
      CAMERA_RETRY_SECONDS: ${CAMERA_RETRY_SECONDS:-5}
      SAVE_ENABLED: ${SAVE_ENABLED:-true}
      CAPTURE_DIR: /data/captures
      SAVE_CONF_FLOOR: ${SAVE_CONF_FLOOR:-0.25}
      SAVE_MIN_INTERVAL_SECONDS: ${SAVE_MIN_INTERVAL_SECONDS:-2.5}
      SAVE_CROPS: ${SAVE_CROPS:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-5}
      RETENTION_MAX_BYTES: ${RETENTION_MAX_BYTES:-10737418240}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
