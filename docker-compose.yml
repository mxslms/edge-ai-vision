version: '3.8'

services:
  fish-detection-app:
    image: ultralytics/ultralytics:latest
    container_name: fish-detection-app
    restart: unless-stopped
    # Open port 5000 to the local network
    ports:
      - "5000:5000"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - .:/usr/src/app
    command: python app.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]