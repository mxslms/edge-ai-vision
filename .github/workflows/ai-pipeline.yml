name: Edge AI Build, Scan & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets a CI-only fix (e.g. this workflow file) be manually re-run against
  # the latest app code without needing a throwaway commit to re-trigger
  # the path-filtered build-jetson job.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Decide which jobs must run. Image rebuild is expensive (~1hr arm64) —
  # only trigger it when inputs that bake into Dockerfile.jetson change.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Path filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - 'app.py'
              - 'requirements.txt'
              - 'Dockerfile.jetson'
              - '.dockerignore'
            deploy:
              - 'docker-compose.jetson.yml'
              - 'docker-compose.jetson.test.yml'
              - 'scripts/build-jetson.sh'
              - 'scripts/install-jetson.sh'
              - 'deploy/jetson/**'
              - '.github/workflows/**'

  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan with Bandit
        run: bandit -r app.py

      - name: Check Jetson dual-platform files exist
        run: |
          test -f Dockerfile.jetson
          test -f docker-compose.jetson.yml
          test -f docker-compose.jetson.test.yml
          test -x scripts/build-jetson.sh
          test -x scripts/install-jetson.sh
          test -f deploy/jetson/edge-ai-vision.service
          test -f deploy/jetson/env.example
          grep -q 'jetson-jetpack6' Dockerfile.jetson
          grep -q 'runtime: nvidia' docker-compose.jetson.yml
          echo "Jetson dual-platform files look intact."

  # ---------------------------------------------------------------------------
  # arm64 / JetPack 6 image (Jetson Orin Nano)
  #
  # Build natively on GitHub's arm64 runners. Do NOT qemu-emulate this on
  # amd64: the Ultralytics JetPack base is large and CUDA/L4T images are
  # unreliable under QEMU.
  #
  # Smoke tests exercise boot + HTTP only (no Jetson GPU in CI). Device GPU
  # / TensorRT still need a real Orin for validation.
  #
  # Skipped unless app-image paths changed (see changes job).
  # ---------------------------------------------------------------------------
  build-jetson:
    name: Build Jetson arm64, Smoke Test & Push
    runs-on: ubuntu-24.04-arm
    needs: [changes, lint-and-scan]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main -- was floating on the branch itself, now pinned
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Jetson image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.jetson
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:ci-jetson
          cache-from: type=gha,scope=jetson-arm64
          cache-to: type=gha,mode=max,scope=jetson-arm64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci-jetson
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          # Trivy's own default is 5m0s, unrelated to any GitHub Actions
          # job/step timeout -- too short for this image (same issue
          # already hit and fixed in scripts/trivy-scan/trivy-scan.sh).
          timeout: '20m'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # No GPU on GitHub arm runners. The Jetson image defaults to device=0;
      # force CPU (+ smaller imgsz) so /video_feed can smoke-test without CUDA.
      - name: Start container
        run: |
          docker run -d --name edge-jetson-test -p 5000:5000 \
            -e INFERENCE_DEVICE=cpu \
            -e IMG_SIZE=320 \
            ${{ env.IMAGE }}:ci-jetson
          echo "Waiting for the Jetson image to load the model and come up..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:5000/healthz > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy in time. Logs:"
          docker logs edge-jetson-test
          exit 1

      - name: Check /healthz
        run: curl -sf http://localhost:5000/healthz

      - name: Check /metrics exposes the three custom metrics
        run: |
          BODY=$(curl -sf http://localhost:5000/metrics)
          echo "$BODY" | grep -q edge_inference_latency_seconds
          echo "$BODY" | grep -q edge_detections_total
          echo "$BODY" | grep -q edge_detection_confidence
          echo "All three custom metrics are present."

      - name: Check /video_feed responds with the MJPEG content type
        run: |
          # CPU YOLO on arm64 can be slow for the first frame; allow headroom.
          CT=$(curl -s -m 60 -o /dev/null -D - http://localhost:5000/video_feed \
               | grep -i '^content-type:' || true)
          echo "Got: $CT"
          echo "$CT" | grep -qi 'multipart/x-mixed-replace'
          echo "Video feed is serving the expected stream type."

      - name: Container logs (always)
        if: always()
        run: docker logs edge-jetson-test || true

      - name: Tear down
        if: always()
        run: docker rm -f edge-jetson-test || true

      # Only publish :jetson from main, and only after the smoke test passed.
      - name: Push :jetson (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ${{ env.IMAGE }}:ci-jetson ${{ env.IMAGE }}:jetson
          docker push ${{ env.IMAGE }}:jetson
