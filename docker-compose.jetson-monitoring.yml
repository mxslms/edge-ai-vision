# Jetson monitoring agents — mirrors the homelab server stack (node-exporter,
# cAdvisor, Promtail) so Prometheus on the home server can scrape this device
# over the LAN. GPU / Tegra metrics come from jetson-orin-exporter (systemd).
#
# Deploy:
#   ./scripts/install-jetson-monitoring.sh
#
# Requires:
#   - monitoring-net (created by install-jetson.sh or this installer)
#   - LOKI_URL pointing at the homelab Loki instance (see monitoring.env.example)
#
services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: jetson-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: jetson-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: jetson-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL:?Set LOKI_URL to your homelab Loki push endpoint}
      DEVICE_NAME: ${DEVICE_NAME:-jetson-orin-nano}
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
