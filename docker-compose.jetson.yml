# Jetson Orin Nano (JetPack 6.x) production compose.
#
# Differences from docker-compose.yml (x86 RTX host):
#   - Image tag :jetson built from Dockerfile.jetson (L4T / JetPack base)
#   - runtime: nvidia (Jetson container runtime) instead of deploy.devices
#   - No DCGM exporter (DCGM targets discrete GPUs; use jtop/tegrastats on Jetson)
#   - Mounts /tmp/argus_socket for optional CSI (nvargus) cameras later
#
# Prerequisites on the Jetson:
#   - JetPack 6.x with Docker + NVIDIA Container Runtime
#   - USB V4L2 camera at /dev/video0 (or set CAMERA_INDEX)
#   - External network: docker network create monitoring-net
#
#   docker compose -f docker-compose.jetson.yml up -d --build
#
services:
  fish-detection-app:
    image: ghcr.io/mxslms/edge-ai-vision:jetson
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: fish-detection-app
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "5000:5000"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
    environment:
      MODEL_PATH: yolov8n.pt
      # Drop to 320 if you need more FPS / less power on Orin Nano
      IMG_SIZE: "640"
      CONF_THRESHOLD: "0.25"
      INFERENCE_DEVICE: "0"
      FRAME_SLEEP: "0.06"
      CAMERA_INDEX: "0"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
